name: Daily Reel

on:
  schedule:
    - cron: "0 4 * * *" # 08:00 Asia/Baku (UTC+4) — build, then publish at 09:00 after approval
  workflow_dispatch:
    inputs:
      date:
        description: "Tarix YYYY-MM-DD (boş = bu gün)"
        required: false
      platforms:
        description: "Platformalar"
        default: "instagram,facebook"
      publish_now:
        description: "09:00-ı gözləmədən dərhal paylaş"
        type: boolean
        default: false

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Build reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          VIDEO_MODE: ${{ vars.VIDEO_MODE }}
        run: |
          ARGS="--out out"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python -m autopost.build $ARGS
      - name: Send preview to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python -m autopost.notify preview --out out
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          retention-days: 14
          if-no-files-found: error
          path: |
            out/reel.mp4
            out/cover.jpg
            out/caption.txt
            out/plan.json
            out/telegram.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Waits for ✅/❌ in Telegram (only TELEGRAM_CHAT_IDS can approve) until 14:00 Baku.
    # Fully automatic posting: set repo variable APPROVAL = none.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: reel
          path: out
      - name: Publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          WAIT="--wait-until 09:00"
          if [ "${{ inputs.publish_now }}" = "true" ]; then WAIT=""; fi
          python -m autopost.publish --out out --platforms "${{ inputs.platforms || 'instagram,facebook' }}"             --approval "${{ vars.APPROVAL || 'telegram' }}" --approval-deadline 14:00 $WAIT
