name: Daily Google Drive Post (09:00 Baku)

on:
  schedule:
    - cron: "45 4 * * *" # Bakı vaxtı ilə 08:45-də oyanır, faylları endirir və dəqiq 09:00-da paylaşır
  workflow_dispatch:
    inputs:
      date:
        description: "Tarix qovluğu YYYY-MM-DD (boş = bu gün və ya növbəti paylaşılmamış)"
        required: false
      platforms:
        description: "Platformalar"
        default: "instagram,facebook,tiktok"
      force:
        description: "Əvvəl paylaşılıbsa belə yenidən paylaş"
        type: boolean
        default: false
      publish_now:
        description: "09:00-ı gözləmədən dərhal paylaş"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-drive-post
  cancel-in-progress: false

jobs:
  publish-from-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies & Chromium for TikTok Studio
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Fetch ready package from Google Drive (Yük.az Reels)
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '1LDJqdkgqU2_a08vSYHdkFd7nJZlTqcQa' }}
        run: |
          ARGS="--out out"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m autopost.drive $ARGS

      - name: Publish to Instagram, Facebook & TikTok at 09:00 Baku
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          WAIT="--wait-until 09:00"
          if [ "${{ inputs.publish_now }}" = "true" ]; then WAIT=""; fi
          python -m autopost.publish --out out \
            --platforms "${{ inputs.platforms || 'instagram,facebook,tiktok' }}" \
            --approval none $WAIT

      - name: Record published Google Drive date in repository
        run: |
          git config user.name "YukAz Automation Bot"
          git config user.email "bot@yuk.az"
          git add content/published_drive.json || true
          git diff --cached --quiet || (git commit -m "chore(drive): record published reel [skip ci]" && git push)
