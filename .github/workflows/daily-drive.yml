name: Daily Google Drive Post (10:30 Baku)

on:
  schedule:
    - cron: "10 6 * * *" # 10:10 Bakı vaxtı (əsas oyanma, 10:30-da paylaşır)
    - cron: "20 6 * * *" # 10:20 Bakı vaxtı (GitHub cron gecikməsinə qarşı ehtiyat #1)
    - cron: "35 6 * * *" # 10:35 Bakı vaxtı (GitHub cron gecikməsinə qarşı ehtiyat #2)
  workflow_dispatch:
    inputs:
      date:
        description: "Tarix qovluğu YYYY-MM-DD (boş = bu gün və ya növbəti paylaşılmamış)"
        required: false
      platforms:
        description: "Platformalar"
        default: "instagram,facebook,tiktok"
      force:
        description: "Əvvəl paylaşılıbsa belə yenidən paylaş"
        type: boolean
        default: false
      publish_now:
        description: "10:30-u gözləmədən dərhal paylaş"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-drive-post-1030-v2
  cancel-in-progress: false

jobs:
  publish-from-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch ready package from Google Drive (Yük.az Reels)
        id: fetch
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '1LDJqdkgqU2_a08vSYHdkFd7nJZlTqcQa' }}
        run: |
          ARGS="--out out"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m autopost.drive $ARGS
          if [ -f "out/already_published.txt" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chrome & Chromium for TikTok Studio
        if: steps.fetch.outputs.skip != 'true'
        run: playwright install chrome chromium

      - name: Publish to Instagram, Facebook & TikTok at 10:30 Baku
        if: steps.fetch.outputs.skip != 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          WAIT="--wait-until 10:30"
          if [ "${{ inputs.publish_now }}" = "true" ]; then WAIT=""; fi
          python -m autopost.publish --out out \
            --platforms "${{ inputs.platforms || 'instagram,facebook,tiktok' }}" \
            --approval none $WAIT

      - name: Record published Google Drive date in repository
        if: always() && steps.fetch.outputs.skip != 'true'
        run: |
          git config user.name "156evakuasiyayt-beep"
          git config user.email "156evakuasiyayt@gmail.com"
          git add content/published_drive.json || true
          git diff --cached --quiet || (git commit -m "chore(drive): record published reel" && git push)
