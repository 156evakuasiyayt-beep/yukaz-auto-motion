<!doctype html>
<html lang="az" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Yük.az — Qutunun səyahəti</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 500; src: url("assets/fonts/Poppins-Medium.ttf") format("truetype"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/Poppins-SemiBold.ttf") format("truetype"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/Poppins-Bold.ttf") format("truetype"); }

      :root {
        --o: #ff4c00; --o2: #ff6a00; --peach: #ffc9a5; --cream: #fff3ea; --sand: #f4d6be;
        --grey: #444444; --mid: #5b5b5b; --ink: #141414; --sage: #6e9c6a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff3ea; font-family: "Poppins", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .abs { position: absolute; display: block; }
      .abs > svg, svg.abs { display: block; width: 100%; height: 100%; overflow: visible; }
      .o { color: var(--o); }

      /* captions — calm, tidy, few */
      .cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 66px; line-height: 1.28; letter-spacing: -0.01em; color: var(--ink); }
      .mask { display: block; overflow: hidden; }
      .mask > span { display: block; }

      /* LAND-CSS-START */
      #land { z-index: 10; }
      #land-cam { position: absolute; inset: 0; transform-origin: 685px 1270px; }
      #sky { position: absolute; inset: 0; background: linear-gradient(180deg, #ffeadc 0%, #ffd8bd 42%, #ffb98e 66%, #ffb98e 100%); }
      #sun { left: 640px; top: 520px; width: 210px; height: 210px; border-radius: 50%; background: #fff6ef; }
      #mtn { left: 0; top: 760px; width: 3200px; height: 560px; }
      #city { left: 380px; top: 640px; width: 1400px; height: 700px; }
      #hills { left: 0; top: 950px; width: 4600px; height: 400px; }
      #near { left: 0; top: 0; width: 5400px; height: 1920px; }
      #road { left: 0; top: 1350px; width: 1080px; height: 90px; background: #444; }
      #ground { left: 0; top: 1440px; width: 1080px; height: 480px; background: linear-gradient(180deg, #f4d6be 0%, #f7e0cd 100%); }
      #dash { left: 0; top: 1391px; width: 6400px; height: 8px; background: repeating-linear-gradient(90deg, #fff3ea 0 64px, transparent 64px 150px); }

      /* LAND-CSS-END */
      /* ---------- ROOM A (old home) ---------- */
      #roomA { z-index: 20; }
      #roomA-move { position: absolute; inset: 0; }
      .wall { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
      .floor { position: absolute; left: 0; top: 1350px; width: 1080px; height: 570px; }
      .skirt { position: absolute; left: 0; top: 1336px; width: 1080px; height: 14px; }
      #roomA .wall { background: #fff3ea; }
      #roomA .floor { background: #f4d6be; }
      #roomA .skirt { background: #f0d2bb; }
      .board { position: absolute; left: 0; width: 1080px; height: 4px; background: rgba(214, 160, 120, 0.25); display: block; }
      .frame { border: 14px solid #444; border-radius: 10px; background: #ffc9a5; overflow: hidden; }
      #a-window { left: 110px; top: 420px; width: 360px; height: 470px; }
      #a-rug { left: 300px; top: 1362px; width: 480px; height: 64px; border-radius: 50%; background: #ffc9a5; }

      /* ---------- the hero (cardboard box → logo cube) ---------- */
      #shadow { z-index: 39; left: 440px; top: 1337px; width: 200px; height: 28px; border-radius: 50%; background: rgba(20, 20, 20, 0.16); }
      #actor { z-index: 40; left: 430px; top: 1090px; width: 220px; height: 270px; transform-origin: 50% 96.3%; }
      #actor-spin { position: absolute; inset: 0; transform-origin: 50% 59.3%; }
      #actor-spin svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #hero { opacity: 0; }
      #box-lid { opacity: 0; }
      #spark { z-index: 41; left: 440px; top: 1050px; width: 200px; height: 200px; border-radius: 50%; border: 8px solid #ff6a00; opacity: 0; }

      /* ---------- ROOM B (new home) ---------- */
      #roomB { z-index: 30; }
      #roomB .wall { background: #ffe6d3; }
      #roomB .floor { background: #f6d3b8; }
      #roomB .skirt { background: #f2c8a8; }
      #b-flash { position: absolute; inset: 0; background: #ffb27e; }
      #b-window { left: 650px; top: 430px; width: 320px; height: 440px; }
      #b-glow { width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 180, 0.95) 0%, rgba(255, 214, 180, 0) 65%); opacity: 0; }
      #b-rug { left: 250px; top: 1364px; width: 580px; height: 76px; border-radius: 50%; background: #ffc9a5; transform-origin: 50% 50%; }

      /* ---------- iris + END CARD ---------- */
      #iris { z-index: 50; left: 390px; top: 1050px; width: 300px; height: 300px; border-radius: 50%; background: #ffffff; }
      #endc { z-index: 45; }
      #e-bg { position: absolute; inset: 0; background: #ffffff; }
      #e-glow { position: absolute; inset: 0; background: radial-gradient(70% 38% at 50% 100%, rgba(255, 106, 0, 0.13), transparent 70%); opacity: 0; }
      #e-cube { left: 390px; top: 470px; width: 300px; height: 344px; transform-origin: 50% 100%; }
      #e-cube svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #e-word { position: absolute; left: 0; right: 0; top: 860px; height: 170px; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 150px; line-height: 1; color: #444; }
      #e-word .l { display: inline-block; }
      #e-dot { display: inline-block; width: 34px; height: 34px; border-radius: 50%; background: var(--o); margin: 30px 26px 0 26px; }
      #e-slogan { top: 1080px; font-size: 64px; }
      #e-pill { left: 280px; top: 1232px; width: 520px; height: 104px; border-radius: 52px; background: var(--o); display: flex; align-items: center; justify-content: center; gap: 18px; color: #fff; font-weight: 700; font-size: 48px; letter-spacing: 0.01em; opacity: 0; box-shadow: 0 18px 40px rgba(255, 76, 0, 0.28); }
      #e-pill svg { width: 46px; height: 46px; display: block; }
      #e-url { position: absolute; left: 0; right: 0; top: 1370px; text-align: center; font-weight: 500; font-size: 36px; color: #8a8a8a; letter-spacing: 0.06em; opacity: 0; }
    </style>
  </head>

        <div id="b-rug" class="abs"></div>
        {{ROOM_B_ITEMS}}
        <div id="capB" class="cap" style="top: 236px"><span class="mask"><span>{{F1}} <span class="o" style="display: inline">{{F2}}</span></span></span></div>
        <div id="b-flash"></div>
      </div>

      <!-- journey caption sits above land, below rooms -->
      <div id="capJ" class="cap clip" data-start="4.5" data-duration="5.4" data-track-index="6" style="top: 236px; z-index: 15; color: {{CAPJ_COLOR}}">
        <span class="mask"><span>{{J1}}</span></span>
        <span class="mask"><span class="o">{{J2}}</span></span>
      </div>

      <!-- ===================== the hero ===================== -->
      <div id="shadow" class="abs clip" data-start="0" data-duration="13.2" data-track-index="5"></div>
      <div id="actor" class="abs clip" data-start="0" data-duration="13.2" data-track-index="4">
        <div id="actor-spin">
          <!-- cardboard box (open) -->
          <svg id="box" viewBox="-110 -160 220 270">
            <g id="box-flaps">
              <polygon points="-86.6,-50 0,-100 -12,-150 -98.6,-100" fill="#f0c8a2" />
              <polygon points="0,-100 86.6,-50 98.6,-100 12,-150" fill="#e8bb92" />
            </g>
            <polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#9a6440" />
            <polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#d99a6c" />
            <polygon points="0,0 86.6,-50 86.6,50 0,100" fill="#e9b98f" />
            <g id="box-front-flaps">
              <polygon points="-86.6,-50 0,0 -16,24 -104,-24" fill="#e4ad80" />
              <polygon points="0,0 86.6,-50 104,-24 16,24" fill="#f0c8a2" />
            </g>
            <g id="box-lid">
              <polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#f0c8a2" />
              <line id="tape" x1="-43.3" y1="-75" x2="43.3" y2="-25" stroke="#fff3ea" stroke-width="16" stroke-linecap="round" />
            </g>
          </svg>
          <!-- logo cube -->
          <svg id="hero" viewBox="-110 -160 220 270">
            <g stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
              <polygon id="h-top" points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#ff5410" />
              <polygon id="h-left" points="-86.6,-50 0,0 0,100 -86.6,50" fill="#444444" />
              <polygon id="h-right" points="0,0 86.6,-50 86.6,50 0,100" fill="#ff4c00" />
            </g>
          </svg>
        </div>
      </div>
      <div id="spark" class="abs clip" data-start="3.7" data-duration="9.4" data-track-index="7"></div>

      <!-- ===================== iris + END CARD ===================== -->
      <div id="iris" class="abs clip" data-start="14.55" data-duration="0.5" data-track-index="8"></div>
      <div id="endc" class="layer clip" data-start="15.0" data-duration="6.0" data-track-index="1">
        <div id="e-bg"></div>
        <div id="e-cam" class="layer">
          <div id="e-cube" class="abs">
            <svg id="e-left" viewBox="-96 -110 192 220"><polygon points="-86.6,-50 0,0 0,100 -86.6,50" fill="#444444" stroke="#fff" stroke-width="7" stroke-linejoin="round" /></svg>
            <svg id="e-right" viewBox="-96 -110 192 220"><polygon points="0,0 86.6,-50 86.6,50 0,100" fill="#ff4c00" stroke="#fff" stroke-width="7" stroke-linejoin="round" /></svg>
            <svg id="e-top" viewBox="-96 -110 192 220"><polygon points="0,-100 86.6,-50 0,0 -86.6,-50" fill="#ff4c00" stroke="#fff" stroke-width="7" stroke-linejoin="round" /></svg>
          </div>
          <div id="e-word"><span class="l">y</span><span class="l">ü</span><span class="l">k</span><span id="e-dot"></span><span class="l">a</span><span class="l">z</span></div>
          <div id="e-slogan" class="cap"><span class="mask"><span>Yükünüz bizə <span class="o" style="display: inline">əmanət!</span></span></span></div>
          <div id="e-pill" class="abs">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" /></svg>
            <span>{{PHONE}}</span>
          </div>
          <div id="e-url">yuk.az</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };

      /* ================= A · OLD HOME (0 – 4.1) ================= */
      tl.fromTo("#roomA-move", { scale: 1.04 }, { scale: 1, duration: 3.6, ease: "sine.out" }, 0);
      tl.fromTo("#capA .mask > span", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 0.25);
      tl.to("#capA", { opacity: 0, duration: 0.4, ease: "power1.in" }, 2.9);

      // the box pops up out of the floor
      tl.fromTo("#actor", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.0);
      tl.fromTo("#shadow", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.0);

      // items lift (anticipation) and arc into the box mouth (540, 1200)
      const flyIn = {{FLY_IN}};
      flyIn.forEach((it, i) => {
        tl.to(it.id, { y: -24, scale: 1.06, duration: 0.12, ease: "power2.out" }, it.t - 0.12);
        tl.to(it.id, { x: 540 - it.cx, duration: 0.32, ease: "power1.inOut" }, it.t);
        tl.to(it.id, { y: 1200 - it.cy, duration: 0.32, ease: "back.in(1.6)" }, it.t);
        tl.to(it.id, { scale: 0.12, rotation: i % 2 ? 200 : -200, duration: 0.32, ease: "power2.in" }, it.t);
        tl.to(it.id, { opacity: 0, duration: 0.05 }, it.t + 0.29);
        tl.fromTo("#actor", { scaleX: 1.07, scaleY: 0.93 }, { scaleX: 1, scaleY: 1, duration: 0.25, ease: "elastic.out(1, 0.4)", immediateRender: false }, it.t + 0.31);
      });
      tl.to("#a-rug", { scaleX: 0.6, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.75);

      // flaps close, tape zips
      tl.to(["#box-flaps", "#box-front-flaps"], { opacity: 0, duration: 0.08 }, 3.0);
      tl.fromTo("#box-lid", { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.in" }, 2.94);
      tl.fromTo("#tape", { strokeDasharray: 110, strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.2, ease: "power1.inOut" }, 3.15);

      // anticipation → jump & spin → becomes the logo cube → lands on the road
      tl.to("#actor", { scaleX: 1.16, scaleY: 0.82, duration: 0.1, ease: "power2.out" }, 3.4);
      tl.to("#actor", { y: -280, scaleX: 0.9, scaleY: 1.12, duration: 0.3, ease: "power2.out" }, 3.5);
      tl.to("#actor", { scaleX: 1, scaleY: 1, duration: 0.15, ease: "sine.inOut" }, 3.8);
      tl.to("#actor-spin", { rotation: 360, duration: 0.55, ease: "power1.inOut" }, 3.5);
      tl.to("#shadow", { scale: 0.45, opacity: 0.4, duration: 0.3, ease: "power2.out" }, 3.5);
      tl.set("#box", { opacity: 0 }, 3.77);
      tl.set("#hero", { opacity: 1 }, 3.77);
      tl.fromTo("#spark", { scale: 0.4, opacity: 0.9, y: -280 }, { scale: 1.9, opacity: 0, duration: 0.45, ease: "power2.out" }, 3.77);
      tl.to("#actor", { y: 0, duration: 0.27, ease: "power2.in" }, 3.8);
      tl.to("#shadow", { scale: 1, opacity: 1, duration: 0.27, ease: "power2.in" }, 3.8);
      tl.fromTo("#actor", { scaleX: 1.2, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.35)", immediateRender: false }, 4.07);
      // the old room rises like a curtain and reveals the open road
      tl.to("#roomA-move", { y: -1960, duration: 0.55, ease: "power3.inOut" }, 3.55);

      /* ================= B · JOURNEY (4.1 – 11.0) ================= */
      const J0 = 4.1, JD = 6.8, JE = "sine.inOut";
      tl.fromTo("#mtn", { x: 0 }, { x: -700, duration: JD, ease: JE }, J0);
      tl.fromTo("#city", { x: 0 }, { x: -1900, duration: JD, ease: JE }, J0);
      tl.fromTo("#hills", { x: 0 }, { x: -2800, duration: JD, ease: JE }, J0);
      tl.fromTo("#near", { x: 0 }, { x: -4200, duration: JD, ease: JE }, J0);
      tl.fromTo("#door", { x: 0 }, { x: -4200, duration: JD, ease: JE }, J0);
      tl.fromTo("#dash", { x: 0 }, { x: -4200, duration: JD, ease: JE }, J0);
      tl.fromTo("#fore", { x: 0 }, { x: -5200, duration: JD, ease: JE }, J0);
      tl.fromTo("#sun", { x: 0, y: 0 }, { x: -90, y: 150, duration: JD, ease: "none" }, J0);

      tl.fromTo("#capJ .mask:nth-child(1) > span", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 4.75);
      tl.fromTo("#capJ .mask:nth-child(2) > span", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 4.9);
      tl.to("#capJ", { opacity: 0, duration: 0.45, ease: "power1.in" }, 9.4);

      // 12 hops, landing on the beat; a full flip every 4th hop
      let spin = 360;
      for (let k = 0; k < 12; k++) {
        const L = 5.0 + 0.5 * k, S = L - 0.36;
        tl.to("#actor", { y: -150, scaleX: 0.94, scaleY: 1.07, duration: 0.18, ease: "power2.out" }, S);
        tl.to("#actor", { y: 0, scaleX: 1, scaleY: 1, duration: 0.18, ease: "power2.in" }, S + 0.18);
        tl.to("#actor", { scaleX: 1.13, scaleY: 0.86, duration: 0.05, ease: "power1.out" }, L);
        tl.to("#actor", { scaleX: 1, scaleY: 1, duration: 0.09, ease: "power1.out" }, L + 0.05);
        tl.to("#shadow", { scale: 0.62, opacity: 0.55, duration: 0.18, ease: "power2.out" }, S);
        tl.to("#shadow", { scale: 1, opacity: 1, duration: 0.18, ease: "power2.in" }, S + 0.18);
        if (k === 3 || k === 7 || k === 11) {
          spin += 360;
          tl.to("#actor-spin", { rotation: spin, duration: 0.36, ease: "power1.inOut" }, S);
        }
      }

      /* ================= C · ARRIVAL (11.0 – 15.0) ================= */
      tl.to("#actor", { x: 145, duration: 0.4, ease: "power1.inOut" }, 11.0);
      tl.to("#actor", { y: -170, duration: 0.2, ease: "power2.out" }, 11.0);
      tl.to("#actor", { y: 0, duration: 0.2, ease: "power2.in" }, 11.2);
      tl.to("#shadow", { x: 145, duration: 0.4, ease: "power1.inOut" }, 11.0);
      tl.fromTo("#actor", { scaleX: 1.14, scaleY: 0.86 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, 11.4);
      tl.fromTo("#door", { scaleX: 1 }, { scaleX: 0.06, duration: 0.25, ease: "power2.inOut", immediateRender: false }, 11.45);
      tl.to("#actor", { scale: 0.45, y: -14, opacity: 0, duration: 0.25, ease: "power2.in" }, 11.62);
      tl.to("#shadow", { opacity: 0, duration: 0.2 }, 11.62);
      tl.fromTo("#land-cam", { scale: 1 }, { scale: 14, duration: 0.42, ease: "power3.in" }, 11.8);

      // new room: the cube drops in, unfolds, everything springs into place
      tl.fromTo("#b-flash", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 12.2);
      tl.set("#actor", { x: 0, y: -1450, scale: 1, scaleX: 1, scaleY: 1, opacity: 1 }, 12.2);
      tl.set("#shadow", { x: 0, scale: 0.3, opacity: 0 }, 12.2);
      tl.to("#actor", { y: 0, duration: 0.33, ease: "power2.in" }, 12.22);
      tl.to("#shadow", { scale: 1, opacity: 1, duration: 0.33, ease: "power2.in" }, 12.22);
      tl.fromTo("#actor", { scaleX: 1.22, scaleY: 0.78 }, { scaleX: 1, scaleY: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, 12.55);
      tl.to("#h-top", { y: -90, opacity: 0, duration: 0.35, ease: "power2.out" }, 12.7);
      tl.to("#h-left", { x: -80, y: 40, opacity: 0, duration: 0.35, ease: "power2.out" }, 12.7);
      tl.to("#h-right", { x: 80, y: 40, opacity: 0, duration: 0.35, ease: "power2.out" }, 12.7);
      tl.to("#shadow", { opacity: 0, duration: 0.3 }, 12.7);
      tl.fromTo("#spark", { y: 0, scale: 0.4, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 12.7);

      const flyOut = {{FLY_OUT}};
      tl.fromTo("#b-rug", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 12.75);
      flyOut.forEach((it) => {
        tl.fromTo(it.id, { x: 540 - it.cx, y: 1230 - it.cy, scale: 0.1, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, it.t);
      });
      flyOut.forEach((it) => {
        if (it.swing) tl.fromTo(it.id, { rotation: 16 }, { rotation: 0, duration: 1.3, ease: "elastic.out(1, 0.25)", immediateRender: false }, it.t + 0.4);
        if (it.grow) tl.fromTo(it.id + " .leaves", { scale: 0.2, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.6, ease: "back.out(2.2)" }, it.t + 0.25);
      });
      if ({{HAS_GLOW}}) tl.fromTo("#b-glow", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 13.5);
      tl.fromTo("#capB .mask > span", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 13.35);
      tl.fromTo("#iris", { scale: 0 }, { scale: 8.5, duration: 0.45, ease: "power3.in" }, 14.58);

      /* ================= D · END CARD (15.0 – 21.0) ================= */
      tl.fromTo("#e-left", { x: -620, y: 220, rotation: -40 }, { x: 0, y: 0, rotation: 0, duration: 0.75, ease: "back.out(1.2)" }, 15.15);
      tl.fromTo("#e-right", { x: 620, y: 300, rotation: 40 }, { x: 0, y: 0, rotation: 0, duration: 0.75, ease: "back.out(1.2)" }, 15.2);
      tl.fromTo("#e-top", { y: -760, rotation: 25 }, { y: 0, rotation: 0, duration: 0.7, ease: "back.out(1.2)" }, 15.25);
      tl.fromTo("#e-cube", { scaleX: 1.08, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.4)" }, 15.95);
      tl.fromTo("#e-cube", { y: 0 }, { y: -10, duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true, immediateRender: false }, 16.7);
      tl.fromTo("#e-word .l", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out", stagger: 0.05 }, 16.05);
      tl.fromTo("#e-dot", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3.5)" }, 16.3);
      tl.fromTo("#e-slogan .mask > span", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 16.8);
      tl.fromTo("#e-pill", { y: 24, scale: 0.85, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 17.4);
      tl.fromTo("#e-url", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 17.75);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
